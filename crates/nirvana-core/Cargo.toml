[package]
name = "nirvana-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = "0.4.45"
directories = "6.0.0"
keyring-core = "1.0.1"
nirvana-entity = { path = "../nirvana-entity" }
nirvana-migration = { path = "../nirvana-migration" }
rand = "0.9.5"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt"] }
toml = "1.1.8"
tracing = "0.1.44"

[dependencies.reqwest]
version = "0.13.5"
default-features = false
features = ["json", "rustls"]

[dependencies.tracing-subscriber]
version = "0.3.23"
features = ["fmt", "env-filter", "chrono"]

[dependencies.sea-orm]
version = "2.0.4"
default-features = false
features = ["macros", "sqlx-sqlite", "runtime-tokio"]

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.1.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-tokio-crypto-rust"] }

[dev-dependencies]
tempfile = "3.27.0"
