[package]
name = "nirvana-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = "0.4.45"
directories = "6.0.0"
nirvana-entity = { path = "../nirvana-entity" }
nirvana-migration = { path = "../nirvana-migration" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"

[dependencies.reqwest]
version = "0.13.5"
default-features = false
features = ["json", "rustls"]

[dependencies.tracing-subscriber]
version = "0.3.23"
features = ["fmt", "env-filter", "chrono"]

[dependencies.sea-orm]
version = "2.0.4"
default-features = false
features = ["macros", "sqlx-sqlite", "runtime-tokio"]

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["macros", "rt"] }
