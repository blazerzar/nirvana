[package]
name = "nirvana-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = "0.4.45"
directories = "6.0.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter", "chrono"] }

[dependencies.reqwest]
version = "0.13.5"
default-features = false
features = ["blocking", "json", "rustls"]

[dev-dependencies]
tempfile = "3.27.0"
