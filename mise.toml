[tools]
hk = "2.6.0"
pkl = "0.32.1"
dprint = "0.63.0"
jactionlint = "2.2.0"
editorconfig-checker = "4.0.2"
rust = { version = "1.99.0", profile = "default" }

[env]
RUSTFMT_TOOLCHAIN = "nightly-2026-10-01"

[bootstrap.packages]
# Debian / Ubuntu
"apt:gcc" = "latest"
"apt:pkgconf" = "latest"
"apt:libssl-dev" = "latest"

# Fedora / RHEL
"dnf:gcc" = "latest"
"dnf:pkgconf-pkg-config" = "latest"
"dnf:openssl-devel" = "latest"

[tasks.setup]
depends = ["setup-rustfmt"]
run = ["hk install --mise"]

[tasks.setup-rustfmt]
description = "Install nightly rustfmt for unstable formatting options"
run = "rustup toolchain install $RUSTFMT_TOOLCHAIN --profile minimal --component rustfmt"

[tasks.lint]
run = "hk check --all"

[tasks.fix]
run = "hk fix --all"

[tasks.test]
description = "Run all tests"
run = "cargo test --workspace"

[tasks.check]
description = "Type-check all crates"
run = "cargo check --workspace"

[tasks.migrate]
description = "Create a new DB migration"
tools = { "cargo:sea-orm-cli" = "2.0.4" }
run = "sea-orm-cli migrate generate -d crates/nirvana-migration"

[tasks.db-diagram]
description = "Generate a Mermaid diagram of the DB"
tools = { "cargo:sea-orm-cli" = "2.0.4" }
run = """
sea-orm-cli generate entity -u "sqlite://$PWD/target/debug/nirvana.db" \
-o "$TMPDIR/nirvana-entities" --er-diagram >/dev/null && \
cp "$TMPDIR/nirvana-entities/entities.mermaid" docs/schema.mermaid && \
rm -rf "$TMPDIR/nirvana-entities"
"""
