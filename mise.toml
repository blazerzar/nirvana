[tools]
hk = "2.6.0"
pkl = "0.32.1"
dprint = "0.63.0"
jactionlint = "2.2.0"
editorconfig-checker = "4.0.2"
rust = { version = "1.99.0", profile = "default" }

[tasks.setup]
run = ["hk install --mise"]

[tasks.lint]
run = "hk check --all"

[tasks.fix]
run = "hk fix --all"

[tasks.test]
description = "Run all tests"
run = "cargo test --workspace"

[tasks.check]
description = "Type-check all crates"
run = "cargo check --workspace"
