[tools]
hk = "2.6.0"
pkl = "0.32.1"
dprint = "0.63.0"
jactionlint = "2.2.0"
editorconfig-checker = "4.0.2"
shellcheck = "0.11.0"
infisical = { version = "0.45.5", platforms = { windows-arm64 = { asset_pattern = "cli_{{ version }}_windows_arm64.zip" } } }
rust = { version = "1.99.0", profile = "default" }

[env]
NIGHTLY_TOOLCHAIN = "nightly-2026-10-01"

[task_config]
includes = ["scripts"]

[bootstrap.packages]
# Debian / Ubuntu
"apt:gcc" = "latest"
"apt:pkgconf" = "latest"
"apt:libssl-dev" = "latest"

# Fedora / RHEL
"dnf:gcc" = "latest"
"dnf:pkgconf-pkg-config" = "latest"
"dnf:openssl-devel" = "latest"

[tasks.setup]
description = "Install git hooks and nightly rustfmt"
depends = ["setup-rustfmt"]
run = ["hk install --mise"]

[tasks.setup-rustfmt]
description = "Install nightly rustfmt for unstable formatting options"
run = "rustup toolchain install $NIGHTLY_TOOLCHAIN --profile minimal --component rustfmt"

[tasks.setup-coverage]
description = "Install nightly LLVM tools for coverage"
run = "rustup toolchain install $NIGHTLY_TOOLCHAIN --profile minimal --component llvm-tools-preview"

[tasks.lint]
description = "Run all checks"
run = "hk check --all"

[tasks.fix]
description = "Fix formatting"
run = "hk fix --all"

[tasks.test]
description = "Run all tests"
run = "cargo test --workspace"

[tasks.test-keyring]
description = "Run keyring tests against the OS keyring (manual, on full machines)"
run = "cargo test -p nirvana-core native_keyring -- --ignored --test-threads=1"

[tasks.coverage]
description = "Run tests with coverage and write HTML and LCOV reports to target/llvm-cov"
depends = ["setup-coverage"]
tools = { "aqua:taiki-e/cargo-llvm-cov" = "0.9.1" }
run = [
  "cargo +$NIGHTLY_TOOLCHAIN llvm-cov --workspace --locked --no-report",
  "cargo +$NIGHTLY_TOOLCHAIN llvm-cov report",
  "cargo +$NIGHTLY_TOOLCHAIN llvm-cov report --html",
  "cargo +$NIGHTLY_TOOLCHAIN llvm-cov report --lcov --output-path target/llvm-cov/lcov.info",
]

[tasks.check]
description = "Type-check all crates"
run = "cargo check --workspace"

[tasks.migrate]
description = "Create a new DB migration"
tools = { "cargo:sea-orm-cli" = "2.0.4" }
run = "sea-orm-cli migrate generate -d crates/nirvana-migration"

[tasks.db-diagram]
description = "Generate a Mermaid diagram of the DB"
tools = { "cargo:sea-orm-cli" = "2.0.4" }
run = """
sea-orm-cli generate entity -u "sqlite://$PWD/target/debug/nirvana.db" \
-o "$TMPDIR/nirvana-entities" --er-diagram >/dev/null && \
cp "$TMPDIR/nirvana-entities/entities.mermaid" docs/schema.mermaid && \
rm -rf "$TMPDIR/nirvana-entities"
"""
